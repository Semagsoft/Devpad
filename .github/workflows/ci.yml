name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CCACHE_DIR: /tmp/ccache

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y -qq clang-format-18
      - name: Check C++ formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  tidy:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential clang-tidy \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on source
        run: |
          find src \( -name '*.cpp' -and -not -name '*kodoterm*' -and -not -name 'mainwindow.cpp' -and -not -name '*qtermwidget*' \) -print0 | \
            xargs -0 clang-tidy --extra-arg=-Wno-unknown-argument -p build

      - name: Run clang-tidy on tests
        run: |
          find tests \( -name '*.cpp' \) -print0 | \
            xargs -0 clang-tidy --extra-arg=-Wno-unknown-argument -p build

  build:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential clang \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev \
            ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.compiler }}

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev \
            libfuse2

      - name: Configure
        run: cmake -S . -B build-appimage -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-appimage -j$(nproc)

      - name: Package AppImage
        run: bash scripts/package-appimage.sh
        env:
          BUILD_DIR: build-appimage
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: Devpad-AppImage-${{ github.ref_name }}
          path: Devpad-*.AppImage

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Devpad-*.AppImage
          fail_on_unmatched_files: false

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Devpad.flatpak
          manifest-path: flatpak/com.semagsoft.Devpad.yml
          cache-key: flatpak-builder
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: Devpad-Flatpak-${{ github.ref_name }}
          path: Devpad.flatpak

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Devpad.flatpak
          fail_on_unmatched_files: false

  windows:
    name: Build and test (Windows MSYS2)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qscintilla-qt6
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-msys2

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON \
            -DBUILD_QSCINTILLA=OFF
        env:
          CCACHE_DIR: D:\a\ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Extract version
        id: version
        shell: msys2 {0}
        run: |
          VERSION=$(grep 'project(Devpad VERSION' CMakeLists.txt | sed 's/.*VERSION \([^ ]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy Qt dependencies with windeployqt
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          windeployqt build/Devpad.exe --dir build/dist
          cp build/Devpad.exe build/dist/Devpad.exe
          for f in $(find build/dist -name '*.dll') build/Devpad.exe; do
            objdump -p "$f" 2>/dev/null
          done | grep 'DLL Name' | sed 's/.*DLL Name: *//' | sort -u | while read -r dll; do
            found=$(find /ucrt64/bin -maxdepth 1 -iname "$dll" -print -quit)
            [ -n "$found" ] && cp -n "$found" build/dist/
          done
          cp build/*.qm build/dist/ 2>/dev/null || true

      - name: Install NSIS
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DPRODUCT_VERSION=$version" installer/installer.nsi
          Move-Item "Devpad-*-Setup.exe" "Devpad-$version-Setup.exe" -ErrorAction SilentlyContinue

      - name: Build MSI installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $wixDir = if (Test-Path "C:\Program Files (x86)\WiX Toolset v3*") {
            (Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*" -Directory | Select-Object -First 1).FullName
          } else {
            "C:\ProgramData\wix314"
          }
          $env:Path = "$wixDir\bin;$env:Path"
          Push-Location installer
          try {
            & heat.exe dir "..\build\dist" -nologo -gg -srd -dr INSTALLDIR -cg DeployedFiles -var var.DistDir -out Heat.wxs
            if ($LASTEXITCODE -ne 0) { throw "heat failed" }
            & candle.exe -arch x64 "-dProductVersion=$version" "-dDistDir=..\build\dist" -out Heat.wixobj Heat.wxs
            if ($LASTEXITCODE -ne 0) { throw "candle Heat.wxs failed" }
            & candle.exe -arch x64 "-dProductVersion=$version" -out Devpad.wixobj Devpad.wxs
            if ($LASTEXITCODE -ne 0) { throw "candle failed" }
            & light.exe -out "..\Devpad-$version.msi" -ext WixUIExtension Devpad.wixobj Heat.wixobj
            if ($LASTEXITCODE -ne 0) { throw "light failed" }
          } finally {
            Remove-Item "Heat.wxs", "Heat.wixobj", "Devpad.wixobj", "Devpad.wixpdb" -ErrorAction SilentlyContinue
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: Devpad-Windows-${{ steps.version.outputs.version }}
          path: |
            Devpad-*-Setup.exe
            Devpad-*.msi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Devpad-*-Setup.exe
            Devpad-*.msi
          fail_on_unmatched_files: false

  macos:
    name: Build and test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        if: matrix.arch == 'arm64'
        run: |
          brew install qt qscintilla2 googletest ccache

      - name: Install Qt (aqtinstall)
        if: matrix.arch == 'x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Set Qt prefix
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "QT_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          else
            echo "QT_PREFIX=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ matrix.arch }}

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS app (.app/.dmg)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          BUILD_DIR: build-release-macos
        run: |
          export CMAKE_PREFIX_PATH="$QT_PREFIX"
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$QT_PREFIX/bin"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PATH="$(brew --prefix)/opt/qt/bin:$(brew --prefix)/opt/qttools/bin:$PATH"
          fi
          bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: Devpad-macOS-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            Devpad-*.dmg
            Devpad-*.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Devpad-*.dmg
            Devpad-*.tar.gz
          fail_on_unmatched_files: false

  sanitize:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Werror" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan.supp
        run: ctest --test-dir build --output-on-failure
