name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CCACHE_DIR: /tmp/ccache

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get install -y -qq clang-format-18
      - name: Check C++ formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror

  tidy:
    name: Clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential clang-tidy \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on source
        run: |
          set -euo pipefail
          # Lint only files present in the compilation database. Sources
          # behind OFF-by-default options (src/tui/tuiapp.cpp needs
          # BUILD_TUI, src/nextgen/* needs BUILD_NEXTGEN) have no DB entry
          # under this configure, and parsing them with fallback flags
          # misparses Qt headers (qcolor.h errors) and fails with exit 123.
          # NOTE: BUILD_NEXTGEN does not compile on this image at all
          # (primoeditor.cpp needs QSGTextNode, absent from noble's
          # qt6-declarative-dev), so full-coverage tidy is not viable here.
          python3 - <<'EOF' > /tmp/tidy_src.txt
          import json
          with open('build/compile_commands.json') as f:
              db = json.load(f)
          seen = set()
          for e in db:
              p = e['file']
              if '/src/' in p and p.endswith('.cpp'):
                  low = p.lower()
                  if 'kodoterm' in low or 'qtermwidget' in low:
                      continue
                  seen.add(p)
          print('\n'.join(sorted(seen)))
          EOF
          xargs -a /tmp/tidy_src.txt -d '\n' -r -n 1 -P "$(nproc)" \
            clang-tidy --quiet \
            --header-filter="^${GITHUB_WORKSPACE}/src/.*" \
            --extra-arg=-Wno-unknown-argument -p build

      - name: Run clang-tidy on tests
        run: |
          set -euo pipefail
          python3 - <<'EOF' > /tmp/tidy_tests.txt
          import json
          with open('build/compile_commands.json') as f:
              db = json.load(f)
          seen = set()
          for e in db:
              p = e['file']
              if '/tests/' in p and p.endswith('.cpp'):
                  seen.add(p)
          print('\n'.join(sorted(seen)))
          EOF
          xargs -a /tmp/tidy_tests.txt -d '\n' -r -n 1 -P "$(nproc)" \
            clang-tidy --quiet \
            --header-filter="^${GITHUB_WORKSPACE}/(src|tests)/.*" \
            --extra-arg=-Wno-unknown-argument -p build

  build:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential clang \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev \
            ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ matrix.compiler }}

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev \
            libfuse2

      - name: Configure
        run: cmake -S . -B build-appimage -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-appimage -j$(nproc)

      - name: Package AppImage
        run: bash scripts/package-appimage.sh
        env:
          BUILD_DIR: build-appimage
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Package portable archive
        run: bash scripts/package-linux.sh
        env:
          BUILD_DIR: build-appimage

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'project(Devpad VERSION' CMakeLists.txt | sed 's/.*VERSION \([^ ]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Flatpak
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9 \
            bash -c '
              set -euo pipefail
              flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
              xvfb-run --auto-servernum flatpak-builder \
                --repo=flatpak-repo \
                --disable-rofiles-fuse \
                --install-deps-from=flathub \
                --force-clean \
                --default-branch=master \
                --arch=x86_64 \
                --state-dir=.flatpak-builder \
                flatpak_app flatpak/com.semagsoft.Devpad.yml
              flatpak build-bundle flatpak-repo "Devpad-${{ steps.version.outputs.version }}-linux-x86_64.flatpak" \
                --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
                --arch=x86_64 \
                com.semagsoft.Devpad master
            '

      - uses: actions/upload-artifact@v6
        with:
          name: Devpad-Linux-${{ github.ref_name }}
          path: |
            Devpad-*.AppImage
            Devpad-*.tar.gz
            Devpad-*.flatpak

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Devpad-*.AppImage
            Devpad-*.tar.gz
            Devpad-*.flatpak
          fail_on_unmatched_files: false

  windows:
    name: Build and test (Windows MSYS2 x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qscintilla-qt6
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-msys2

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON \
            -DBUILD_QSCINTILLA=OFF
        env:
          CCACHE_DIR: D:\a\ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Extract version
        id: version
        shell: msys2 {0}
        run: |
          VERSION=$(grep 'project(Devpad VERSION' CMakeLists.txt | sed 's/.*VERSION \([^ ]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy Qt and runtime dependencies
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/deploy-windows-deps.ps1 \
            -BuildDir "$GITHUB_WORKSPACE\build" \
            -DistDir "$GITHUB_WORKSPACE\build\dist"

      - name: Install NSIS
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $outfile = Join-Path $env:GITHUB_WORKSPACE "Devpad-$version-Setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DPRODUCT_VERSION=$version" "/DPRODUCT_OUTFILE=$outfile" installer/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $outfile)) {
            Get-ChildItem -Path . -Recurse -Filter "Devpad-*-Setup.exe" | ForEach-Object { Copy-Item $_.FullName "Devpad-$version-Setup.exe" -Force }
          }

      - name: Build MSI installer
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-msi.ps1 `
            -BuildDir "$env:GITHUB_WORKSPACE\build" `
            -Version "${{ steps.version.outputs.version }}" `
            -Arch x64 `
            -OutputMsi "$env:GITHUB_WORKSPACE\Devpad-${{ steps.version.outputs.version }}.msi" `
            -SkipDeploy

      - name: Package portable zip
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build/dist/* -DestinationPath "Devpad-$version-windows-x86_64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: Devpad-Windows-x86_64-${{ steps.version.outputs.version }}
          path: |
            Devpad-*-Setup.exe
            Devpad-*.msi
            Devpad-*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Devpad-*-Setup.exe
            Devpad-*.msi
            Devpad-*.zip
          fail_on_unmatched_files: false

  windows-arm64:
    name: Build and test (Windows ARM64, CLANGARM64)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: CLANGARM64

      # Installed in a separate step (instead of setup-msys2's `install:`)
      # so transient mirror failures ("Operation too slow", download
      # library errors on the ~350 MiB Qt/FFmpeg closure) can be retried.
      - name: Install CLANGARM64 dependencies
        run: |
          PKGS="mingw-w64-clang-aarch64-qt6-base \
            mingw-w64-clang-aarch64-qt6-multimedia \
            mingw-w64-clang-aarch64-qt6-svg \
            mingw-w64-clang-aarch64-qt6-tools \
            mingw-w64-clang-aarch64-qscintilla-qt6 \
            mingw-w64-clang-aarch64-cmake \
            mingw-w64-clang-aarch64-cc \
            mingw-w64-clang-aarch64-ccache"
          for attempt in 1 2 3 4 5; do
            echo "Install attempt $attempt/5..."
            if pacman -S --noconfirm --needed --disable-download-timeout $PKGS; then
              echo "Dependencies installed."
              break
            fi
            echo "Install attempt $attempt failed, retrying in 20s..."
            sleep 20
            if [ "$attempt" = 5 ]; then
              echo "Dependency installation failed after 5 attempts."
              exit 1
            fi
          done

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: windows-arm64

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON \
            -DBUILD_QSCINTILLA=OFF
        env:
          CCACHE_DIR: D:\a\ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Extract version
        id: version
        shell: msys2 {0}
        run: |
          VERSION=$(grep 'project(Devpad VERSION' CMakeLists.txt | sed 's/.*VERSION \([^ ]*\).*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy Qt and runtime dependencies
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/deploy-windows-deps.ps1 \
            -BuildDir "$GITHUB_WORKSPACE\build" \
            -DistDir "$GITHUB_WORKSPACE\build\dist"

      - name: Install NSIS
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Install WiX Toolset
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: choco install wixtoolset -y --no-progress

      - name: Build NSIS installer (arm64)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $outfile = Join-Path $env:GITHUB_WORKSPACE "Devpad-$version-arm64-Setup.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DPRODUCT_VERSION=$version" "/DPRODUCT_ARCH=arm64" "/DPRODUCT_OUTFILE=$outfile" installer/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $outfile)) {
            Get-ChildItem -Path . -Recurse -Filter "Devpad-*-Setup.exe" | ForEach-Object { Copy-Item $_.FullName $outfile -Force }
          }

      - name: Build MSI installer (arm64)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-msi.ps1 `
            -BuildDir "$env:GITHUB_WORKSPACE\build" `
            -Version "${{ steps.version.outputs.version }}" `
            -Arch arm64 `
            -OutputMsi "$env:GITHUB_WORKSPACE\Devpad-${{ steps.version.outputs.version }}-arm64.msi" `
            -SkipDeploy

      - name: Package portable zip (arm64)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build/dist/* -DestinationPath "Devpad-$version-windows-arm64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: Devpad-Windows-arm64-${{ steps.version.outputs.version }}
          path: |
            Devpad-*-Setup.exe
            Devpad-*.msi
            Devpad-*.zip

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Devpad-*-Setup.exe
            Devpad-*.msi
            Devpad-*.zip
          fail_on_unmatched_files: false

  macos:
    name: Build and test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x86_64
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Untap untrusted Homebrew tap
        run: brew untap aws/tap || true

      - name: Install dependencies (Homebrew)
        if: matrix.arch == 'arm64'
        run: |
          brew install qt qscintilla2 googletest ccache

      - name: Install Qt (aqtinstall)
        if: matrix.arch == 'x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Set Qt prefix
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "QT_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          else
            echo "QT_PREFIX=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: macos-${{ matrix.arch }}

      - name: Configure
        run: |
          export CCACHE_BASEDIR=${{ github.workspace }}
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.logicalcpu)

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package macOS app (.app/.dmg)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          BUILD_DIR: build-release-macos
        run: |
          export CMAKE_PREFIX_PATH="$QT_PREFIX"
          export PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$QT_PREFIX/bin"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export PATH="$(brew --prefix)/opt/qt/bin:$(brew --prefix)/opt/qttools/bin:$PATH"
          fi
          bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: Devpad-macOS-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            Devpad-*.dmg
            Devpad-*.tar.gz

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Devpad-*.dmg
            Devpad-*.tar.gz
          fail_on_unmatched_files: false

  sanitize:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake build-essential \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
            qt6-tools-dev \
            libgl-dev \
            libqscintilla2-qt6-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Werror" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.lsan.supp
        run: ctest --test-dir build --output-on-failure
